# SPDX-License-Identifier: GPL-3.0-or-later
#
# purple-mimi's checks (docs/design/purple-mimi.md §10.1, §11). The Rust
# side runs as mimid's does; the two glues are built against real
# libpurple headers, which is the only way these errors are caught.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # The OpenMLS fork and mimid are git dependencies; the CLI fetches them
  # faster and with less memory.
  CARGO_NET_GIT_FETCH_WITH_CLI: "true"

jobs:
  rust:
    name: Rust (fmt, clippy, test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install the latest stable Rust
        run: |
          rustup toolchain install stable --profile minimal \
            --component rustfmt,clippy
          rustup default stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-features --all-targets -- -D warnings
      - run: cargo test --workspace --all-features
      - name: Documentation
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --workspace --no-deps --all-features

  typos:
    name: Typos
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: crate-ci/typos@master

  header:
    name: The committed C header is current
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install stable --profile minimal && rustup default stable
      - uses: Swatinem/rust-cache@v2
      # Pinned: a cbindgen upgrade must be a deliberate commit, since it
      # would rewrite the committed header.
      - run: cargo install cbindgen --version 0.29.4 --locked
      - run: ci/check-header.sh

  mimid-patch:
    name: The OpenMLS patch table matches mimid's
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install stable --profile minimal && rustup default stable
      - uses: Swatinem/rust-cache@v2
      # §5.2: Cargo applies only the top workspace's [patch.crates-io],
      # so a drift from mimid's would build a different OpenMLS.
      - run: cargo fetch
      - run: ci/check-mimid-patch.sh

  purple2-linux:
    name: libpurple 2 plugin (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: libpurple 2 development files
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake pkg-config libpurple-dev libglib2.0-dev
      - run: rustup toolchain install stable --profile minimal && rustup default stable
      - uses: Swatinem/rust-cache@v2
      - name: Build
        run: |
          cmake -B build -DPURPLE2=ON -DPURPLE3=OFF
          cmake --build build
      - name: The plugin exports only its entry point
        run: ci/check-exports.sh build/libpurple-mimi.so purple_init_plugin
      - uses: actions/upload-artifact@v4
        with:
          name: libpurple-mimi-linux-x86_64
          path: build/libpurple-mimi.so

  purple3-linux:
    name: libpurple 3 plugin (Linux, built from the Pidgin 3 alpha)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # No distribution packages libpurple 3, so the image builds it.
      - name: Build the container image
        run: podman build -t purple-mimi-debian13 -f ci/debian13.Containerfile .
      - name: Build libpurple 3
        run: podman build -t purple-mimi-purple3 -f ci/purple3.Containerfile .
      - name: Build the plugin
        run: |
          podman run --rm -v "$PWD":/src:Z -w /src purple-mimi-purple3 sh -c '
            cmake -B build -DPURPLE2=OFF -DPURPLE3=ON &&
            cmake --build build &&
            ci/check-exports.sh build/libpurple3-mimi.so gplugin_query'
      - uses: actions/upload-artifact@v4
        with:
          name: libpurple3-mimi-linux-x86_64
          path: build/libpurple3-mimi.so

  purple2-macos:
    name: libpurple 2 plugin (macOS, Homebrew)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      # Homebrew's pidgin carries libpurple 2.14; it has no libpurple 3
      # (§10.3), so macOS builds the libpurple 2 plugin only.
      - run: brew install pidgin cmake pkg-config
      - run: rustup toolchain install stable --profile minimal && rustup default stable
      - uses: Swatinem/rust-cache@v2
      - name: Build
        run: |
          cmake -B build -DPURPLE2=ON -DPURPLE3=OFF
          cmake --build build
      - uses: actions/upload-artifact@v4
        with:
          name: libpurple-mimi-macos
          path: build/libpurple-mimi.so

  smoke:
    name: Headless smoke test (libpurple 2)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build the container image
        run: podman build -t purple-mimi-debian13 -f ci/debian13.Containerfile .
      - name: Load the plugin in a real libpurple
        run: |
          podman run --rm -v "$PWD":/src:Z -w /src purple-mimi-debian13 sh -c '
            cmake -B build -DPURPLE2=ON -DPURPLE3=OFF &&
            cmake --build build &&
            tests/smoke-purple2.sh build/libpurple-mimi.so'
