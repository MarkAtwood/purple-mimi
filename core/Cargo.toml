[package]
name = "purple-mimi-core"
description = "The engine of purple-mimi: mimid's agent inside a libpurple plugin"
edition.workspace = true
license.workspace = true
version.workspace = true
repository.workspace = true
publish = false

[dependencies]
# The front end keeps what it reported in a record's ext map (§5.6),
# which is serde JSON.
serde.workspace = true
serde_json.workspace = true
mimid-agent-core.workspace = true
mimid-agent-store.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
thiserror.workspace = true
getrandom.workspace = true

[features]
# Tests only: a panic on purpose inside an account's task
# (Process::test_panic_next_open). Never enabled by a build that ships.
test-hooks = []

[dev-dependencies]
tempfile.workspace = true
serde_json.workspace = true
