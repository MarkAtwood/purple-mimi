# SPDX-License-Identifier: GPL-3.0-or-later
[workspace]
resolver = "3"
members = ["core", "ffi"]

[workspace.package]
edition = "2024"
license = "GPL-3.0-or-later"
version = "0.1.0"
repository = "https://github.com/MarkAtwood/purple-mimi"

[workspace.dependencies]
# mimid, pinned by git revision (decision PQ12): tag purple-groundwork-1.
# The mimid crates are publish = false. When this revision changes, the
# [patch.crates-io] below must be copied again from mimid's Cargo.toml at
# the same revision; ci/check-mimid-patch.sh compares them.
mimid-agent-core = { git = "https://github.com/MarkAtwood/mimid", rev = "41babcc9" }
mimid-agent-store = { git = "https://github.com/MarkAtwood/mimid", rev = "41babcc9" }
# The versions mimid uses.
tokio = { version = "1.53.3", default-features = false, features = ["rt-multi-thread", "sync", "time", "macros"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", default-features = false, features = ["std", "registry"] }
thiserror = "2.0.21"
getrandom = "=0.3.4"
tempfile = "=3.23.0"
serde_json = "=1.0.154"

# Copied from mimid's Cargo.toml at the pinned revision: Cargo applies
# only the top workspace's patches (docs/design/purple-mimi.md §5.2).
[patch.crates-io]
openmls = { git = "https://github.com/MarkAtwood/openmls", rev = "f1680d98fa8879ba257dd4a80a6bacabab24a4d0" }
openmls_traits = { git = "https://github.com/MarkAtwood/openmls", rev = "f1680d98fa8879ba257dd4a80a6bacabab24a4d0" }
openmls_rust_crypto = { git = "https://github.com/MarkAtwood/openmls", rev = "f1680d98fa8879ba257dd4a80a6bacabab24a4d0" }
openmls_basic_credential = { git = "https://github.com/MarkAtwood/openmls", rev = "f1680d98fa8879ba257dd4a80a6bacabab24a4d0" }
openmls_sqlite_storage = { git = "https://github.com/MarkAtwood/openmls", rev = "f1680d98fa8879ba257dd4a80a6bacabab24a4d0" }
openmls_memory_storage = { git = "https://github.com/MarkAtwood/openmls", rev = "f1680d98fa8879ba257dd4a80a6bacabab24a4d0" }
openmls_serialization_helpers = { git = "https://github.com/MarkAtwood/openmls", rev = "f1680d98fa8879ba257dd4a80a6bacabab24a4d0" }

# catch_unwind at the C ABI needs unwinding (docs/design/purple-mimi.md
# §5.5); never set panic = "abort".
[profile.release]
panic = "unwind"
lto = "thin"
codegen-units = 1
strip = "debuginfo"

[profile.dev]
panic = "unwind"

# As mimid: SHA-256 and HMAC are slow unoptimised.
[profile.dev.package.sha2]
opt-level = 3
[profile.dev.package.hmac]
opt-level = 3
