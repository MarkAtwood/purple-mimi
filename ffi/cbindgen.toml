#
# The C header of purple-mimi's ABI (docs/design/purple-mimi.md §5.5), as
# generated by cbindgen. The result is committed as include/purple-mimi.h
# so that a build needs neither cbindgen nor the network; ci/check-header.sh
# regenerates it and fails if it differs.

language = "C"
header = """
/* SPDX-License-Identifier: GPL-3.0-or-later
 *
 * purple-mimi's C ABI: MIMI rooms through mimid, for libpurple.
 *
 * GENERATED by cbindgen from the purple-mimi-ffi crate. Do not edit by
 * hand: edit ffi/src/lib.rs and run ci/check-header.sh --write.
 *
 * The glue must refuse to load when mimi_abi_version() differs from
 * MIMI_ABI_VERSION below, and must pass MIMI_ABI_VERSION in
 * mimi_init_options.abi_version.
 */"""
include_guard = "PURPLE_MIMI_H"
cpp_compat = true
documentation = true
documentation_style = "doxy"
tab_width = 4
line_length = 76
no_includes = true
sys_includes = ["stdbool.h", "stdint.h", "stddef.h"]

[export]
# Only this crate's own items: the core crate's Rust types never appear
# at the ABI.
include = []
exclude = ["mimi_test_panic"]

[parse]
parse_deps = false

[fn]
args = "horizontal"
sort_by = "None"

[const]
allow_static_const = false
allow_constexpr = false
